<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f2ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日々">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>日々</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <span class="top-side"></span>
  <span class="top-title" id="screenTitle">今日</span>
  <span class="top-side right">
    <i id="saveDot" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></i>
    <button class="icon-btn" id="searchBtn" aria-label="検索">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    </button>
  </span>
</header>

<main id="view"></main>
<div id="float"></div>

<nav class="tabs" aria-label="メニュー">
  <button data-tab="today" class="active" aria-label="今日">
    <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/></svg><span>今日</span>
  </button>
  <button data-tab="diary" aria-label="日記">
    <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>日記</span>
  </button>
  <button data-tab="highlights" aria-label="留める">
    <svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-4-5 4z"/></svg><span>留める</span>
  </button>
  <button data-tab="works" aria-label="作品">
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="m10 10 5 2.5-5 2.5z"/></svg><span>作品</span>
  </button>
  <button data-tab="settings" aria-label="設定">
    <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>設定</span>
  </button>
</nav>

<dialog id="sheet"><form method="dialog" id="sheetForm"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" accept="application/json,.json" hidden>

<script src="app.js"></script>
</body>
</html>
